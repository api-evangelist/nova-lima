aid: nova-lima
name: Nova Lima
description: >-
  Runrun.it (headquartered in Nova Lima, Brazil, and backed by 500 Global) is
  process and project management software that automates work requests and
  organizes a team's tasks, projects, clients, time tracking, and documents in a
  single place. Its public REST API (v1.0) exposes tasks, projects, boards and
  board stages, clients, teams, users, comments, documents, evaluations,
  templates, and time-worked reporting, authenticated with App-Key and
  User-Token request headers on paid plans. The platform also publishes an
  OAuth 2.0/2.1 authorization server (authorization code + PKCE), a hosted
  OAuth-protected MCP server at /mcp, and a webhook event system covering roughly
  35 task, project, client, team, and comment events.
